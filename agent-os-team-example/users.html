<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户列表</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #6b7280;
      --border: #e5e7eb;
      --badge-on: #e7f6ec;
      --badge-on-text: #1a7f37;
      --badge-off: #fdecec;
      --badge-off-text: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e6e8eb;
        --muted: #9aa3af;
        --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 600;
      background: #4f7cff;
    }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; }
    .email { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .badge {
      flex: none;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.on { background: var(--badge-on); color: var(--badge-on-text); }
    .badge.off { background: var(--badge-off); color: var(--badge-off-text); }
    .count { color: var(--muted); font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>用户列表</h1>
    <p class="subtitle">以下为 Mock 数据示例</p>
    <ul class="list" id="user-list"></ul>
    <p class="count" id="count"></p>
  </main>

  <script>
    // Mock 数据：用户列表
    const users = [
      { name: "张三", email: "zhangsan@example.com", role: "工程师", active: true },
      { name: "李四", email: "lisi@example.com", role: "产品经理", active: true },
      { name: "王五", email: "wangwu@example.com", role: "设计师", active: false },
      { name: "赵六", email: "zhaoliu@example.com", role: "测试", active: true },
    ];

    const colors = ["#2f54d0", "#0b8a6e", "#c0392b", "#5f3dc4"];

    const escapeHtml = (s) =>
      String(s).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[ch]);

    const listEl = document.getElementById("user-list");
    listEl.innerHTML = users
      .map((u, i) => {
        const initials = escapeHtml(u.name.slice(0, 1));
        const name = escapeHtml(u.name);
        const badge = u.active
          ? '<span class="badge on">在职</span>'
          : '<span class="badge off">离职</span>';
        return `
          <li class="card">
            <span class="avatar" style="background:${colors[i % colors.length]}">${initials}</span>
            <span class="info">
              <span class="name">${name} · ${escapeHtml(u.role)}</span><br />
              <span class="email">${escapeHtml(u.email)}</span>
            </span>
            ${badge}
          </li>`;
      })
      .join("");

    document.getElementById("count").textContent =
      "共 " + users.length + " 位用户，在职 " + users.filter((u) => u.active).length + " 人";
  </script>
</body>
</html>
